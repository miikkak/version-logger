  statuses: write

jobs:
  super-lint:
    uses: miikkak/workflows/.github/workflows/super-linter.yml@e1ec8f36b0e4e5ff24fc42ca53fd4e14fe87eadb # main
    secrets: inherit
    with:
      validate-bash: false
      validate-json: true
